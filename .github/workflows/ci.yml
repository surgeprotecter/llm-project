name: CI

on:
  push:
    branches: [main, HL_test, rzm]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check src/travel_agent tests

      - name: Unit tests
        run: uv run pytest tests/unit
