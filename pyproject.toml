[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "travel-planning-agent"
version = "0.1.0"
description = "A local, stateful travel planning agent built with LangGraph."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "COMP7608B Project Team" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.21,<5",
  "jinja2>=3.1,<4",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=2.0,<4",
  "markdown-it-py>=2.2,<5",
  "mcp>=2.0,<3",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "prompt-toolkit>=3.0.48,<4",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
  "pycountry>=24.6,<27",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.30,<1",
  "tzdata>=2026.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
travel-agent = "travel_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
